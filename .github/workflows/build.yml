name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          npm ci
          pip install fonttools

      - name: Regenerate themes, icons and the product icon font
        run: npm run build

      - name: Fail if generated output drifted from what is committed
        run: |
          git diff --stat --exit-code themes icons \
            || { echo "::error::Generated files are stale. Run 'npm run build' and commit."; exit 1; }

      - name: Typecheck, unit test, validate the package
        run: npm run check

      - name: Package
        run: npx vsce package --allow-missing-repository --no-dependencies --baseImagesUrl https://x.invalid/

      - uses: actions/upload-artifact@v4
        with:
          name: ruoste-vsix
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Attach VSIX to the tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ruoste-vsix

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --generate-notes
